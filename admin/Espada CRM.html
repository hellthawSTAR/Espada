<!doctype html>
<html>
  <head>
    <meta charset="utf8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <style>
      :root {
        color-scheme: light;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      body {
        margin: 0;
        padding: 0;
        font:
          14px -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        background: #fff;
        color: #000;
      }
      img {
        max-width: 100%;
      }
      [hidden]:not([hidden="until-found" i]) {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <title>Espada CRM</title>
    <meta name="claude:viewport-fit-sides" content="cover" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Manrope:wght@400;500;600;700&display=swap"
    />
    <style>
      :root {
        --bg: #f4f5f7;
        --surface: #ffffff;
        --ink: #0b0b0d;
        --muted: #5d6370;
        --line: #dfe2e8;
        --blue: #1f4fff;
        --blue-ink: #ffffff;
        --blue-soft: #e6ecff;
        --new: #1f4fff;
        --new-bg: #e6ecff;
        --work: #a15c00;
        --work-bg: #fff0d6;
        --done: #13795b;
        --done-bg: #dcf4ea;
        --bad: #b3261e;
        --display: "Cormorant Garamond", Georgia, serif;
        --body: "Manrope", system-ui, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0d0e12;
          --surface: #16181e;
          --ink: #f4f5f7;
          --muted: #9aa1b0;
          --line: #272a33;
          --blue: #6b8bff;
          --blue-ink: #0b0b0d;
          --blue-soft: #1e2748;
          --new: #8aa3ff;
          --new-bg: #1e2748;
          --work: #f0b45a;
          --work-bg: #3a2c12;
          --done: #5fd1a6;
          --done-bg: #12332a;
          --bad: #ff8a80;
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --bg: #0d0e12;
        --surface: #16181e;
        --ink: #f4f5f7;
        --muted: #9aa1b0;
        --line: #272a33;
        --blue: #6b8bff;
        --blue-ink: #0b0b0d;
        --blue-soft: #1e2748;
        --new: #8aa3ff;
        --new-bg: #1e2748;
        --work: #f0b45a;
        --work-bg: #3a2c12;
        --done: #5fd1a6;
        --done-bg: #12332a;
        --bad: #ff8a80;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family: var(--body);
        font-size: 14px;
        line-height: 1.45;
        padding-left: max(16px, env(safe-area-inset-left, 0px));
        padding-right: max(16px, env(safe-area-inset-right, 0px));
        padding-block: 28px 56px;
      }
      .wrap {
        max-width: 980px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      :focus-visible {
        outline: 2px solid var(--blue);
        outline-offset: 2px;
      }
      header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }
      .brand {
        font-family: var(--display);
        font-size: 34px;
        font-weight: 600;
        letter-spacing: 0.14em;
        line-height: 1;
      }
      .brand small {
        display: block;
        font-family: var(--body);
        font-size: 10px;
        letter-spacing: 0.38em;
        color: var(--muted);
        margin-top: 6px;
        font-weight: 600;
      }
      .sub {
        color: var(--muted);
        font-size: 13px;
      }
      .tiles {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
      }
      .tile {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 14px 16px;
        text-align: left;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .tile b {
        font-size: 28px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        line-height: 1.1;
      }
      .tile span {
        font-size: 12px;
        color: var(--muted);
        font-weight: 600;
        letter-spacing: 0.04em;
      }
      .tile[aria-pressed="true"] {
        border-color: var(--blue);
        box-shadow: inset 0 0 0 1px var(--blue);
      }
      .bar {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      .bar input[type="search"] {
        flex: 1 1 220px;
        min-width: 0;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 11px 16px;
      }
      .btn {
        border: 1px solid var(--line);
        background: var(--surface);
        border-radius: 16px;
        padding: 11px 18px;
        font-weight: 600;
        cursor: pointer;
      }
      .btn.primary {
        background: var(--blue);
        border-color: var(--blue);
        color: var(--blue-ink);
      }
      .btn.danger {
        color: var(--bad);
      }
      .btn.small {
        padding: 6px 12px;
        border-radius: 12px;
        font-size: 12px;
      }
      .panel {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .panel h2 {
        font-size: 15px;
        margin: 0;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 12px;
      }
      label {
        display: flex;
        flex-direction: column;
        gap: 5px;
        font-size: 12px;
        color: var(--muted);
        font-weight: 600;
        min-width: 0;
      }
      label input,
      label select,
      label textarea {
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 10px 12px;
        color: var(--ink);
        font-weight: 500;
        font-size: 14px;
        width: 100%;
      }
      textarea {
        resize: vertical;
        min-height: 84px;
      }
      .row-actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
      }
      .msg {
        font-size: 12px;
        color: var(--muted);
      }
      .list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .lead {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 16px;
        overflow: hidden;
      }
      .head {
        display: grid;
        grid-template-columns: minmax(0, 1.3fr) minmax(0, 1.1fr) auto auto auto;
        gap: 12px;
        align-items: center;
        padding: 12px 16px;
        width: 100%;
        background: none;
        border: 0;
        text-align: left;
        cursor: pointer;
      }
      .nm {
        font-weight: 700;
        overflow-wrap: anywhere;
      }
      .ph {
        font-variant-numeric: tabular-nums;
        color: var(--muted);
      }
      .chip {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.04em;
        border-radius: 999px;
        padding: 3px 10px;
        white-space: nowrap;
      }
      .chip.m {
        background: var(--bg);
        border: 1px solid var(--line);
        color: var(--muted);
      }
      .chip.s-new {
        background: var(--new-bg);
        color: var(--new);
      }
      .chip.s-work {
        background: var(--work-bg);
        color: var(--work);
      }
      .chip.s-done {
        background: var(--done-bg);
        color: var(--done);
      }
      .dt {
        font-size: 12px;
        color: var(--muted);
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }
      .more {
        border-top: 1px solid var(--line);
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .seg {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .seg button {
        border: 1px solid var(--line);
        background: var(--bg);
        border-radius: 12px;
        padding: 7px 14px;
        font-weight: 600;
        cursor: pointer;
        font-size: 13px;
      }
      .seg button[aria-pressed="true"] {
        background: var(--blue);
        border-color: var(--blue);
        color: var(--blue-ink);
      }
      .empty {
        background: var(--surface);
        border: 1px dashed var(--line);
        border-radius: 16px;
        padding: 36px 20px;
        text-align: center;
        color: var(--muted);
      }
      .empty b {
        display: block;
        color: var(--ink);
        font-size: 16px;
        margin-bottom: 6px;
      }
      .hint {
        font-size: 12px;
        color: var(--muted);
      }
      @media (max-width: 640px) {
        .tiles {
          grid-template-columns: repeat(2, 1fr);
        }
        .head {
          grid-template-columns: 1fr auto;
          row-gap: 4px;
        }
        .head .ph {
          grid-column: 1;
        }
        .head .dt {
          grid-column: 1;
        }
        .head .chip.m {
          grid-column: 2;
          grid-row: 1;
          justify-self: end;
        }
        .head .chip.s {
          grid-column: 2;
          grid-row: 2;
          justify-self: end;
        }
      }
      @media (prefers-reduced-motion: no-preference) {
        .lead {
          transition: border-color 0.15s;
        }
        .lead:hover {
          border-color: var(--blue);
        }
      }
    </style>

    <div class="wrap">
      <header>
        <div class="brand">ESPADA<small>COMPANY · ЗАЯВКИ</small></div>
        <div class="sub" id="sync">Загрузка…</div>
      </header>

      <div class="tiles" id="tiles"></div>

      <div class="bar">
        <input
          type="search"
          id="q"
          placeholder="Поиск по имени, телефону, заметке"
          aria-label="Поиск"
        />
        <button class="btn primary" id="addBtn" type="button">
          Новая заявка
        </button>
        <button class="btn" id="impBtn" type="button">Импорт списком</button>
      </div>

      <form class="panel" id="addForm" hidden>
        <h2>Новая заявка</h2>
        <div class="grid">
          <label>Имя<input id="fName" required autocomplete="off" /></label>
          <label
            >Телефон<input
              id="fPhone"
              inputmode="tel"
              placeholder="+7 918 111 11 11"
              required
              autocomplete="off"
          /></label>
          <label
            >Связь<select id="fMsg">
              <option>Telegram</option>
              <option>ВКонтакте</option>
            </select></label
          >
        </div>
        <label
          >Заметка<textarea
            id="fNote"
            placeholder="Что хочет клиент, бюджет, ниша"
          ></textarea>
        </label>
        <div class="row-actions">
          <button class="btn primary" type="submit">Сохранить</button
          ><button class="btn" type="button" id="addCancel">Отмена</button
          ><span class="msg" id="addMsg"></span>
        </div>
      </form>

      <form class="panel" id="impForm" hidden>
        <h2>Импорт списком</h2>
        <p class="hint" style="margin: 0">
          Одна заявка на строку: имя, телефон, Telegram или ВКонтакте.
          Разделитель — запятая, точка с запятой или табуляция. Так можно
          перенести заявки из писем и сообщений.
        </p>
        <label
          >Строки<textarea
            id="impText"
            placeholder="Анна; +7 918 111 11 11; Telegram&#10;Игорь, 9181112233, ВКонтакте"
          ></textarea>
        </label>
        <div class="row-actions">
          <button class="btn primary" type="submit">Добавить</button
          ><button class="btn" type="button" id="impCancel">Отмена</button
          ><span class="msg" id="impMsg"></span>
        </div>
      </form>

      <div class="list" id="list"></div>
    </div>

    <script>
      (function () {
        var STATUS = { new: "Новая", work: "В работе", done: "Закрыта" };
        var leads = [],
          filter = "all",
          query = "",
          openId = null,
          confirmId = null,
          col = null,
          loaded = false,
          canWrite = true;

        function $(id) {
          return document.getElementById(id);
        }
        function el(tag, cls, text) {
          var e = document.createElement(tag);
          if (cls) e.className = cls;
          if (text != null) e.textContent = text;
          return e;
        }
        function fmtDate(iso) {
          try {
            return new Date(iso).toLocaleString("ru-RU", {
              day: "2-digit",
              month: "2-digit",
              hour: "2-digit",
              minute: "2-digit",
            });
          } catch (e) {
            return "";
          }
        }
        function fmtPhone(raw) {
          var d = String(raw).replace(/\D/g, "");
          if (d.length === 11 && (d[0] === "7" || d[0] === "8")) d = d.slice(1);
          if (d.length !== 10) return String(raw).trim();
          return (
            "+7 " +
            d.slice(0, 3) +
            " " +
            d.slice(3, 6) +
            " " +
            d.slice(6, 8) +
            " " +
            d.slice(8)
          );
        }
        function copy(text, btn) {
          function ok() {
            var t = btn.textContent;
            btn.textContent = "Скопировано";
            setTimeout(function () {
              btn.textContent = t;
            }, 1200);
          }
          try {
            navigator.clipboard.writeText(text).then(ok, function () {});
          } catch (e) {}
        }

        function counts() {
          var c = { all: leads.length, new: 0, work: 0, done: 0 };
          leads.forEach(function (l) {
            if (c[l.status] != null) c[l.status]++;
          });
          return c;
        }

        function renderTiles() {
          var c = counts(),
            box = $("tiles");
          box.textContent = "";
          [
            ["all", "Все заявки"],
            ["new", "Новые"],
            ["work", "В работе"],
            ["done", "Закрытые"],
          ].forEach(function (t) {
            var b = el("button", "tile");
            b.type = "button";
            b.setAttribute("aria-pressed", String(filter === t[0]));
            b.appendChild(el("b", null, String(c[t[0]])));
            b.appendChild(el("span", null, t[1]));
            b.onclick = function () {
              filter = t[0];
              render();
            };
            box.appendChild(b);
          });
        }

        function save(l, patch) {
          if (!col) return;
          col
            .doc(l.id)
            .update(patch)
            .catch(function (e) {
              $("sync").textContent =
                "Не удалось сохранить: " +
                (e && e.code === "invalid_argument"
                  ? "нет прав на запись"
                  : "ошибка связи");
            });
        }

        function renderList() {
          var box = $("list");
          box.textContent = "";
          var q = query.trim().toLowerCase();
          var rows = leads.filter(function (l) {
            if (filter !== "all" && l.status !== filter) return false;
            if (!q) return true;
            return (
              (
                l.name +
                " " +
                l.phone +
                " " +
                (l.note || "") +
                " " +
                l.messenger
              )
                .toLowerCase()
                .indexOf(q) > -1
            );
          });
          if (!rows.length) {
            var e = el("div", "empty");
            if (!loaded) {
              e.appendChild(el("b", null, "Загружаем заявки"));
            } else if (!leads.length) {
              e.appendChild(el("b", null, "Заявок пока нет"));
              e.appendChild(
                el(
                  "span",
                  null,
                  "Нажмите «Новая заявка» или вставьте несколько строк через «Импорт списком». Заявки сохраняются в общей базе и видны всем, у кого есть доступ к странице.",
                ),
              );
            } else {
              e.appendChild(el("b", null, "Ничего не найдено"));
              e.appendChild(
                el("span", null, "Измените фильтр или поисковый запрос."),
              );
            }
            box.appendChild(e);
            return;
          }
          rows.forEach(function (l) {
            var card = el("div", "lead");
            var head = el("button", "head");
            head.type = "button";
            head.setAttribute("aria-expanded", String(openId === l.id));
            head.appendChild(el("span", "nm", l.name));
            head.appendChild(el("span", "ph", l.phone));
            head.appendChild(el("span", "chip m", l.messenger));
            head.appendChild(
              el("span", "chip s s-" + l.status, STATUS[l.status] || l.status),
            );
            head.appendChild(el("span", "dt", fmtDate(l.createdAt)));
            head.onclick = function () {
              openId = openId === l.id ? null : l.id;
              confirmId = null;
              render();
            };
            card.appendChild(head);
            if (openId === l.id) {
              var more = el("div", "more");
              var seg = el("div", "seg");
              Object.keys(STATUS).forEach(function (k) {
                var b = el("button", null, STATUS[k]);
                b.type = "button";
                b.setAttribute("aria-pressed", String(l.status === k));
                b.onclick = function () {
                  if (l.status !== k) save(l, { status: k });
                };
                seg.appendChild(b);
              });
              more.appendChild(seg);
              var lab = el("label", null, "Заметка");
              var ta = document.createElement("textarea");
              ta.id = "note-" + l.id;
              ta.value = l.note || "";
              ta.onchange = function () {
                save(l, { note: ta.value });
              };
              lab.appendChild(ta);
              more.appendChild(lab);
              var act = el("div", "row-actions");
              var cp = el("button", "btn small", "Копировать телефон");
              cp.type = "button";
              cp.onclick = function () {
                copy(l.phone, cp);
              };
              act.appendChild(cp);
              if (l.source)
                act.appendChild(el("span", "msg", "Источник: " + l.source));
              if (l.consent === false)
                act.appendChild(
                  el("span", "msg", "Согласие на обработку не отмечено"),
                );
              if (confirmId === l.id) {
                var y = el("button", "btn small danger", "Удалить навсегда");
                y.type = "button";
                y.onclick = function () {
                  confirmId = null;
                  openId = null;
                  col
                    .doc(l.id)
                    .delete()
                    .catch(function () {});
                };
                var n = el("button", "btn small", "Отмена");
                n.type = "button";
                n.onclick = function () {
                  confirmId = null;
                  render();
                };
                act.appendChild(y);
                act.appendChild(n);
              } else {
                var d = el("button", "btn small danger", "Удалить");
                d.type = "button";
                d.onclick = function () {
                  confirmId = l.id;
                  render();
                };
                act.appendChild(d);
              }
              more.appendChild(act);
              card.appendChild(more);
            }
            box.appendChild(card);
          });
        }

        function render() {
          var active = document.activeElement;
          var keep =
            active &&
            active.tagName === "TEXTAREA" &&
            active.id &&
            active.id.indexOf("note-") === 0
              ? { id: active.id, v: active.value }
              : null;
          renderTiles();
          renderList();
          if (keep) {
            var t = $(keep.id);
            if (t) {
              t.value = keep.v;
              t.focus();
            }
          }
        }

        function newLead(name, phone, messenger, note, source) {
          return {
            name: name.trim(),
            phone: fmtPhone(phone),
            messenger: messenger === "MAX" ? "MAX" : "Telegram",
            status: "new",
            note: note || "",
            source: source,
            consent: true,
            createdAt: new Date().toISOString(),
          };
        }

        $("q").addEventListener("input", function (e) {
          query = e.target.value;
          renderList();
        });
        function toggle(id, show) {
          ["addForm", "impForm"].forEach(function (f) {
            $(f).hidden = f !== id || !show;
          });
          if (show) {
            var first = $(id).querySelector("input,textarea");
            if (first) first.focus();
          }
        }
        $("addBtn").onclick = function () {
          toggle("addForm", $("addForm").hidden);
        };
        $("impBtn").onclick = function () {
          toggle("impForm", $("impForm").hidden);
        };
        $("addCancel").onclick = function () {
          toggle("addForm", false);
        };
        $("impCancel").onclick = function () {
          toggle("impForm", false);
        };

        $("addForm").addEventListener("submit", function (e) {
          e.preventDefault();
          if (!col) {
            $("addMsg").textContent = "База недоступна, попробуйте позже.";
            return;
          }
          var d = newLead(
            $("fName").value,
            $("fPhone").value,
            $("fMsg").value,
            $("fNote").value,
            "Вручную",
          );
          if (!d.name || d.phone.replace(/\D/g, "").length < 10) {
            $("addMsg").textContent =
              "Проверьте имя и телефон: нужно 10 цифр после +7.";
            return;
          }
          col.add(d).then(
            function () {
              $("addForm").reset();
              $("addMsg").textContent = "";
              toggle("addForm", false);
            },
            function () {
              $("addMsg").textContent =
                "Не удалось сохранить. У вас может не быть прав на запись.";
            },
          );
        });

        $("impForm").addEventListener("submit", function (e) {
          e.preventDefault();
          if (!col) {
            $("impMsg").textContent = "База недоступна, попробуйте позже.";
            return;
          }
          var lines = $("impText")
              .value.split(/\n/)
              .map(function (s) {
                return s.trim();
              })
              .filter(Boolean),
            items = [],
            bad = 0;
          lines.forEach(function (ln) {
            var p = ln.split(/[;\t,]/).map(function (s) {
              return s.trim();
            });
            if (p.length < 2 || !p[0] || p[1].replace(/\D/g, "").length < 10) {
              bad++;
              return;
            }
            items.push(
              newLead(
                p[0],
                p[1],
                /max/i.test(p[2] || "") ? "ВКонтакте" : "Telegram",
                p.slice(3).join(", "),
                "Импорт",
              ),
            );
          });
          if (!items.length) {
            $("impMsg").textContent =
              "Не распознано ни одной строки. Нужны имя и телефон.";
            return;
          }
          Promise.all(
            items.map(function (d) {
              return col.add(d);
            }),
          ).then(
            function () {
              $("impText").value = "";
              $("impMsg").textContent = "";
              toggle("impForm", false);
              if (bad)
                $("sync").textContent =
                  "Добавлено " + items.length + ", пропущено строк: " + bad;
            },
            function () {
              $("impMsg").textContent =
                "Часть заявок не сохранилась. Проверьте список и повторите.";
            },
          );
        });

        render();

        (async function () {
          var timer = setTimeout(function () {
            if (!loaded) $("sync").textContent = "База пока не отвечает";
          }, 10000);
          try {
            var db = await claude.use("db");
            if (!db) {
              clearTimeout(timer);
              $("sync").textContent = "Войдите в Claude, чтобы видеть заявки";
              loaded = true;
              render();
              return;
            }
            col = db.collection("leads");
            try {
              var user = await claude.use("user");
              if (user) {
                var cw = user.can("data.write");
                if (cw === false) {
                  canWrite = false;
                  $("addBtn").hidden = true;
                  $("impBtn").hidden = true;
                }
              }
            } catch (e) {}
            col.orderBy("createdAt", "desc").onSnapshot(
              function (snap) {
                clearTimeout(timer);
                loaded = true;
                leads = snap.docs.map(function (d) {
                  var x = d.data() || {};
                  return {
                    id: d.id,
                    name: x.name || "Без имени",
                    phone: x.phone || "",
                    messenger: x.messenger || "Telegram",
                    status: STATUS[x.status] ? x.status : "new",
                    note: x.note || "",
                    source: x.source || "",
                    consent: x.consent,
                    createdAt: x.createdAt || "",
                  };
                });
                $("sync").textContent = leads.length
                  ? "Обновлено " +
                    new Date().toLocaleTimeString("ru-RU", {
                      hour: "2-digit",
                      minute: "2-digit",
                    })
                  : "";
                render();
              },
              function () {
                clearTimeout(timer);
                loaded = true;
                $("sync").textContent = "Не удалось загрузить заявки";
                render();
              },
            );
          } catch (e) {
            clearTimeout(timer);
            loaded = true;
            $("sync").textContent = "База недоступна";
            render();
          }
        })();
      })();
    </script>
  </body>
</html>
